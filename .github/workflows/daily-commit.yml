name: Daily Random Commits

on:
  schedule:
    # Daily around 9:00 AM IST
    - cron: "30 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-random-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create random commits
        shell: bash
        run: |
          git config user.name "sandeepbihari2005"
          git config user.email "sandeepbihari2005@gmail.com"

          MESSAGES=(
            "Update project files"
            "Minor improvements"
            "Daily maintenance"
            "Update development log"
            "Refactor project notes"
            "Improve documentation"
            "Routine project update"
            "Clean up project files"
            "Update progress log"
            "Small project improvements"
            "Code cleanup"
            "Project maintenance"
            "Documentation update"
            "Development progress"
            "Minor fixes"
          )

          # Random number between 3 and 12
          COMMIT_COUNT=$((RANDOM % 10 + 3))

          echo "Creating $COMMIT_COUNT commits today..."

          for ((i=1; i<=COMMIT_COUNT; i++))
          do
            RANDOM_INDEX=$((RANDOM % ${#MESSAGES[@]}))
            MESSAGE="${MESSAGES[$RANDOM_INDEX]}"

            echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - Update $i - $MESSAGE - $RANDOM" >> activity-log.txt

            git add activity-log.txt
            git commit -m "$MESSAGE"

            sleep 1
          done

          git push
